p{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;margin-top:.4rem}
a.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 1.85rem;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid transparent}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#040404}
.secondary{border-color:var(--line)!important;color:var(--text)}
.links{font-size:.9rem}
.links a{color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
